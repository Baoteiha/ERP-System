# Tests every push to main or dev and every pull request. A push to main that passes also publishes
# the backend and frontend images to GitHub's registry (ghcr.io) as private packages; the server signs
# in with a read-only token and its Watchtower swaps them in within minutes (docs/deploy.md,
# "Automatic updates"). So a push to main is a deploy.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# a newer push to the same branch cancels the run still going for the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # the integration tests start PostgreSQL in Docker (Testcontainers), which the runner provides
      - run: ./gradlew test
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx ng build --configuration production
      # nginx reads its config only when the container starts, so a broken one would first show on
      # the server; check it here instead
      - name: Check nginx.conf
        run: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t

  publish:
    name: Publish the ${{ matrix.service }} image
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :latest is what the server runs; the commit tag keeps every version for a rollback. The
      # source label links the package to this repository, so later runs may push to it.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/baoteiha/erp-system-${{ matrix.service }}:latest
            ghcr.io/baoteiha/erp-system-${{ matrix.service }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
