spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/erpcafe
    # the app role row-level security binds (created by V22 or docker/postgres-init)
    username: erp_app
    password: erp_app
  flyway:
    # the schema owner, for migrations and the system work (login, refresh, startup)
    user: erpcafe
    password: erpcafe
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8090
  error:
    include-stacktrace: always

app:
  security:
    jwt:
      keys:
        - kid: dev-1
          secret: dev-erp-cafe-jwt-secret-change-me-in-production-0123456789
          active: true
    bootstrap:
      admin-email: admin@esscafe.vn
      admin-password: admin1234

logging:
  level:
    vn.essvn.erpcafe: DEBUG
    org.hibernate.SQL: DEBUG
