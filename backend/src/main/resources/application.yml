server:
  # Tomcat's RemoteIpValve honours X-Forwarded-For only from trusted proxies (default: private and
  # loopback ranges). A proxy outside those ranges must be listed in server.tomcat.remoteip.internal-proxies,
  # otherwise every client looks like the proxy to the login throttle.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For

spring:
  application:
    name: erp-cafe
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway connects as the schema owner (spring.flyway.user, see DataSourceConfig); V22 creates the
    # app role with the password the app connects with, if the role does not exist yet.
    placeholders:
      appRolePassword: ${spring.datasource.password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  datasource:
    owner:
      # The schema owner's pool, for the system scope only (login, refresh, logout, startup, the
      # cross-company checks, the token purge). A request holds at most one of its connections at a time.
      maximum-pool-size: 10
      connection-timeout: 30s
  security:
    jwt:
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    login:
      max-failures: 10
      window: 15m
      max-failures-per-address: 20
      max-tracked-keys: 10000
