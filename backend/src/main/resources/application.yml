server:
  # Tomcat's RemoteIpValve honours X-Forwarded-For only from trusted proxies (default: private and
  # loopback ranges). A proxy outside those ranges must be listed in server.tomcat.remoteip.internal-proxies,
  # otherwise every client looks like the proxy to the login throttle.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For

spring:
  application:
    name: erp-cafe
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    login:
      max-failures: 10
      window: 15m
      max-failures-per-address: 20
      max-tracked-keys: 10000
