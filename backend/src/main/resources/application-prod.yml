spring:
  datasource:
    url: ${DB_URL}
    # the app role row-level security binds; V22 creates it with this password if it is missing
    username: erp_app
    password: ${DB_APP_PASSWORD}
  flyway:
    # the schema owner: owns the tables and holds BYPASSRLS (and CREATEROLE unless erp_app exists)
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
  jpa:
    show-sql: false

server:
  error:
    include-stacktrace: never

app:
  security:
    jwt:
      # To rotate, give the whole list in the environment (APP_SECURITY_JWT_KEYS_0_KID, _0_SECRET,
      # _0_ACTIVE, then _1_...), which replaces this one: the new key active, the old one inactive until
      # the access-token TTL has passed, then removed.
      keys:
        - kid: ${JWT_KEY_ID:primary}
          secret: ${JWT_SECRET}
          active: true
    bootstrap:
      admin-email: ${ADMIN_EMAIL}
      admin-password: ${ADMIN_PASSWORD:}

logging:
  level:
    vn.essvn.erpcafe: INFO
