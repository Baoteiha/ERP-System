# Test profile. The datasource is supplied at runtime by the Testcontainers
# Postgres container (see AbstractIntegrationTest); everything else mirrors dev
# but quiet.
spring:
  datasource:
    # the app role V22 creates with this password; Flyway and the system work run as the
    # container's superuser (AbstractIntegrationTest)
    username: erp_app
    password: erp-app-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  security:
    jwt:
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      secret: test-erp-cafe-jwt-secret-key-for-tests-0123456789
    login:
      # MockMvc requests all come from one address; keep the per-address limit out of other tests' way
      max-failures-per-address: 100000
    bootstrap:
      admin-email: admin@esscafe.vn
      admin-password: admin1234

logging:
  level:
    vn.essvn.erpcafe: INFO
    org.hibernate.SQL: WARN
