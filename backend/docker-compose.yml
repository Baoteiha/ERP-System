services:
  postgres:
    image: postgres:16
    container_name: erpcafe-postgres
    environment:
      POSTGRES_DB: erpcafe
      POSTGRES_USER: erpcafe
      POSTGRES_PASSWORD: erpcafe
      # the app role's password (application-dev.yml); POSTGRES_USER above is the schema owner
      ERP_APP_PASSWORD: erp_app
    ports:
      - "5433:5432"
    volumes:
      - erpcafe-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpcafe -d erpcafe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  erpcafe-pgdata:
