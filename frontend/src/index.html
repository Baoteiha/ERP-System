<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ERP-Cafe</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ERP-Cafe — multi-tenant business ERP: sales, catalog, inventory, purchasing, staff and reporting.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0B0D14">
  <script>
    try {
      var t = localStorage.getItem('erpcafe.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      var d = localStorage.getItem('erpcafe.density');
      document.documentElement.setAttribute('data-density', d === 'compact' ? 'compact' : 'comfortable');
    } catch (e) { /* storage blocked: defaults apply */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C83FF' stroke-width='2' stroke-linejoin='round'><path d='M12 2 21 7v10l-9 5-9-5V7z'/><circle cx='12' cy='12' r='3' fill='%237C83FF'/></svg>">
</head>
<body>
  <app-root></app-root>
</body>
</html>
