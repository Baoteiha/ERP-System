# Serves the built Angular app and forwards /api to the backend container, so the browser sees one
# origin (the refresh cookie and the API share it, as with `ng serve` and proxy.conf.json in dev).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. A backend container gets a new address each time it is replaced (an update), and
    # nginx resolves a fixed proxy_pass host only once, at start; through a variable it asks again
    # every 10 seconds instead of answering 502 until restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        # no URI after the variable, so the request's own path is passed on unchanged
        proxy_pass $backend;
        proxy_set_header Host $host;
        # the login throttle keys on the client address; the backend trusts this header from
        # private-range proxies such as this container
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # build output file names carry a content hash, so they can be cached for good
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # every other path is an Angular route: hand it index.html, never cached
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
